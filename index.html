<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VMI</title>
<style>
:root{--navy:#16336a;--navy2:#1f4a8f;--bg:#eef2f7;--card:#fff;--ink:#1f2a3d;--mut:#6b7a90;--line:#e6ebf3;
--red:#e5484d;--amber:#f5a623;--green:#2f9e5b;--blue:#2563c9;--teal:#2aa6a0}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Segoe UI','Malgun Gothic','Helvetica Neue',Arial,'Noto Sans CJK KR',sans-serif;font-size:13px;line-height:1.35}
/* ---------- 한 화면 맞춤 (TV): 2240×1260 (16:9) 캔버스를 창 크기에 맞게 축소/확대 */
#fit{width:2240px;transform-origin:0 0}
html.fit,html.fit body{overflow:hidden;height:100%}
html.fit #fit,html.fitw #fit{position:absolute;top:0;left:0}
html.fitw,html.fitw body{overflow-x:hidden;overflow-y:auto;height:auto}
.page{width:2240px;height:1260px;padding:14px;display:grid;grid-template-columns:232px minmax(0,1fr);gap:14px}
.page.tall{height:auto;min-height:1260px}
.main{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.view{flex:1;min-height:0}
/* ---------- 사이드 메뉴 */
.side{background:linear-gradient(180deg,#12306a,#1d4b92);border-radius:16px;padding:18px 12px;display:flex;flex-direction:column;gap:8px;color:#fff;box-shadow:0 4px 14px rgba(22,51,106,.25)}
.side .logo{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;border-bottom:1px solid rgba(255,255,255,.18);margin-bottom:8px}
.side .logo svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:1.7}
.side .logo b{font-size:21px;font-weight:800;letter-spacing:-.3px}.side .logo small{display:block;color:#bcd0f2;font-size:11px;font-weight:600}
.nav{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:#dbe6f8;font:inherit;font-size:15.5px;font-weight:800;text-align:left;padding:14px 12px;border-radius:12px;cursor:pointer;line-height:1.25}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;flex:none}
.nav:hover{background:rgba(255,255,255,.1)}
.nav.on{background:#fff;color:#16336a;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.nav:focus-visible{outline:3px solid #ffd166;outline-offset:2px}
.side .sfoot{margin-top:auto;font-size:11px;color:#bcd0f2;line-height:1.5;padding:0 8px}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.4);border-radius:9px;overflow:hidden;height:32px}
.seg button{border:0;background:transparent;color:#dbe6f8;font:inherit;font-size:12.5px;font-weight:800;padding:0 12px;cursor:pointer}
.seg button.on{background:#fff;color:#16336a}
.ctl .seg{border-color:#cdd8ea;height:34px}.ctl .seg button{color:#1d4b92}.ctl .seg button.on{background:#1d4b92;color:#fff}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(22,51,106,.07);border:1px solid #edf1f7;padding:14px 16px}
.card h3{margin:0 0 10px;font-size:15px;font-weight:800;color:#18274a;display:flex;align-items:center;gap:8px}
.card h3 small{font-weight:600;color:var(--mut);font-size:11px;margin-left:auto}
svg{display:block}
/* ---------- header */
.top{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(95deg,#12306a,#1d4b92);border-radius:14px;padding:10px 20px;min-height:66px;color:#fff;box-shadow:0 4px 14px rgba(22,51,106,.25)}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:40px;height:40px;stroke:#fff;fill:none;stroke-width:1.7}
.brand h1{margin:0;font-size:25px;letter-spacing:-.5px;font-weight:800}
.brand .en{color:#bcd0f2;font-size:14px;margin-left:6px}
.hr{display:flex;align-items:center;gap:14px}
.date{display:flex;align-items:center;gap:10px}
.date svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:1.6}
.date small{display:block;color:#bcd0f2;font-size:11px}
.date b{font-size:15px}
.vr{width:1px;height:34px;background:rgba(255,255,255,.3)}
.co{font-size:12px;line-height:1.4}.co small{color:#bcd0f2;font-size:10.5px}
/* ---------- layout */
.sec{margin-top:12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.sm{border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;display:flex;gap:12px;align-items:center;line-height:1.4}
.sm b{flex:none;border-radius:7px;padding:3px 11px;font-size:13px;color:#fff;background:rgba(0,0,0,.28)}
.sm.a{background:#16336a;color:#fff}
.sm.g{background:#dff3e5;color:#18552f}.sm.y{background:#ffe9b0;color:#5b3d00}.sm.r{background:#fbd7d9;color:#8f1f24}
.top-grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:12px;margin-top:10px}
.stack.main>.card:last-child{flex:1}
.stack.main{display:flex;flex-direction:column;gap:12px}
.stack{display:grid;gap:12px;align-content:start}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;min-height:92px;box-shadow:0 2px 10px rgba(22,51,106,.08)}
.kpi .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:34px;height:34px;fill:none;stroke-width:1.8}
.kpi .lab{font-size:14px;font-weight:700}
.kpi .val{font-size:29px;font-weight:800;letter-spacing:-1px;margin:2px 0 0;white-space:nowrap}
.kpi .val span{font-size:15px;margin-left:5px;font-weight:700}
.kpi .sub{font-size:12px;margin-top:3px}
.k1{background:linear-gradient(135deg,#14306a,#1c4a95);color:#fff}.k1 .ic{background:rgba(255,255,255,.14)}.k1 svg{stroke:#fff}
.k2{background:#fdeaea;color:#c63b3f}.k2 .ic{background:#fff}.k2 svg{stroke:#e5484d}
.k3{background:#e4eefc;color:#1d5cc4}.k3 .ic{background:#fff}.k3 svg{stroke:#2563c9}
.k4{background:#e1f4e8;color:#1f7a47}.k4 .ic{background:#fff}.k4 svg{stroke:#2f9e5b}
.up{color:#8fe3b0}.dn{color:#ffb4b4}
.k2 .sub,.k3 .sub,.k4 .sub{color:inherit;opacity:.85}
.row2{display:grid;grid-template-columns:1.35fr .9fr 1fr;gap:12px}
.row2>.card:nth-child(2) .donut{height:100%;align-items:center;padding-bottom:26px}
/* ---------- bars */
.bars{display:grid;gap:7px}
.bar{display:grid;grid-template-columns:128px 1fr 118px;gap:10px;align-items:center;cursor:pointer;border-radius:7px;padding:1px 4px}
.bar:hover,.bar.on{background:#f1f6ff}
.bar .nm{font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:14px;border-radius:7px;background:#e3eaf6;position:relative;overflow:hidden}
.bar .fl{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.bar .vl{font-size:11.5px;color:#46546b;text-align:right;white-space:nowrap}
.bar .vl b{color:#1b2a4c}
.lg{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin-bottom:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.s-SEND\ NOW{--c:#e5484d}.s-SEND\ MORE{--c:#f5a623}.s-OK{--c:#3fae6a}.s-FULL{--c:#5b9bd5}.s-OVER\ CAPACITY{--c:#7a4bc0}
/* ---------- donut */
.donut{display:flex;align-items:center;gap:14px}
.dl{display:grid;gap:7px;font-size:12px;flex:1;min-width:0}
.dl div{display:flex;align-items:center;gap:7px}
.dl i{width:10px;height:10px;border-radius:50%;flex:none}
.dl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.dl b{color:#3b4a66}
/* ---------- tables */
table{border-collapse:collapse;width:100%}
th{font-size:11.5px;color:var(--mut);font-weight:700;text-align:center;padding:7px 6px;background:#f5f8fc;border-bottom:1px solid var(--line)}
td{padding:6px 6px;border-bottom:1px solid #eef2f8;text-align:center;font-size:12.5px}
td.l,th.l{text-align:left}
td.l b{white-space:nowrap}
tr:last-child td{border-bottom:0}
.chip{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:800;color:#fff;white-space:nowrap}
.c-red{background:#e5484d}.c-amber{background:#f5a623;color:#3a2a00}.c-blue{background:#2f7ed8}.c-green{background:#3fae6a}.c-grey{background:#9aa6b8}.c-violet{background:#8a63d2}.c-orange{background:#ee7d31}
.neg{color:#d63b40;font-weight:800}.pos{color:#1f7a47;font-weight:700}
.tbl-items th{cursor:pointer;line-height:1.25;min-width:84px}
.tbl-items th:hover{background:#e9f1ff}
.tbl-items td.rl{font-weight:800;color:#33425e;background:#f9fbfe;text-align:left;padding-left:12px;white-space:nowrap}
.scroll{overflow-x:auto}
/* ---------- alerts */
.al{display:grid;gap:9px}
.al>div{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:start;font-size:12.5px}
.al i{width:9px;height:9px;border-radius:50%;margin-top:5px}
.al b{display:block;font-weight:800}
.al span{color:#55637a;font-size:12px}
.al em{font-style:normal;color:#7a879b;font-size:11.5px;white-space:nowrap;text-align:right}
.d-red{background:#e5484d}.d-amber{background:#f5a623}.d-blue{background:#2f7ed8}.d-green{background:#3fae6a}
/* ---------- space card */
.eq{display:grid;grid-template-columns:1fr 18px 1fr 18px 1fr;align-items:center;gap:4px;margin:6px 0 10px}
.eq .t{border-radius:12px;color:#fff;text-align:center;padding:10px 4px}
.eq .t b{display:block;font-size:26px;letter-spacing:-1px;line-height:1.05}
.eq .t small{font-size:11px;opacity:.95}
.eq .o{text-align:center;color:#8794a8;font-weight:800;font-size:18px}
.verd{border-radius:10px;padding:10px 12px;font-size:12.5px;font-weight:700;line-height:1.45}
.v-green{background:#e1f4e8;color:#1c6b3d}.v-amber{background:#fff1cf;color:#7a5200}.v-red{background:#fde3e3;color:#a82c30}
/* ---------- location section */
.lhead{display:flex;align-items:center;gap:14px;background:linear-gradient(95deg,#12306a,#1d4b92);border-radius:14px;padding:8px 18px;color:#fff;flex-wrap:wrap;min-height:66px}
.lhead .brand svg{width:34px;height:34px}.lhead h2{margin:0;font-size:23px;font-weight:800}.lhead .en{color:#bcd0f2;font-size:13px;margin-left:8px}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-left:6px}
.lc{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;cursor:pointer;padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.1);user-select:none}
.lc i{width:15px;height:15px;border-radius:4px;display:inline-block}
.lc.off{opacity:.4}.lc.off2{opacity:.85}
.lc b{font-weight:800}
.ctl{margin-left:auto;display:flex;gap:8px;align-items:center}
.ctl select,.ctl input,.ctl button{height:34px;border-radius:8px;border:1px solid #cdd8ea;padding:0 11px;font:inherit;font-size:12.5px;background:#fff;color:#223}
.ctl input{width:210px}
.ctl button{cursor:pointer;font-weight:700;color:#1d4b92}
.pill{display:none;background:#fff;color:#1d4b92;border-radius:999px;padding:5px 11px;font-weight:800;font-size:12px;cursor:pointer}
.lgrid{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,.8fr) minmax(0,.92fr);grid-template-rows:minmax(0,1fr);gap:12px;margin-top:10px;align-items:stretch}
.mapcard{display:flex;flex-direction:column}
.mapcard .map{flex:1;grid-auto-rows:minmax(36px,1fr)}
.midcol{position:relative;min-height:0}
.midc{position:absolute;inset:0;overflow-y:auto;display:grid;gap:12px;align-content:start;padding-right:2px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.mh{grid-column:span 1;text-align:center;background:#1b3d78;color:#fff;border-radius:8px;padding:6px 2px;font-size:12px;font-weight:800}
.tile{border-radius:8px;border:1px solid;border-left-width:4px;padding:2px 6px 2px 7px;min-height:36px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;transition:opacity .15s,transform .1s;overflow:hidden}
.tile b{font-size:11.5px;line-height:1.15;white-space:nowrap}
.tile span{font-size:10.5px;color:#4a566c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,0,0,.15)}
.tile.mx{border-width:2px 2px 2px 4px;border-top-color:#ee7d31;border-right-color:#ee7d31;border-bottom-color:#ee7d31}
.tile.dim{opacity:.18}
.tile.hit{outline:2.5px solid #2563c9;box-shadow:0 0 0 3px rgba(37,99,201,.2)}
.tile.sel{outline:3px solid #111;z-index:2}
.st-Stocked{background:#dff3e5;border-color:#3fae6a}
.st-In-use{background:#fff0c4;border-color:#f5a623}
.st-Mixed{background:#fde1cf;border-color:#ee7d31}
.st-Stale{background:#eadfd2;border-color:#a6865c}
.st-Tonly{background:#ece4fb;border-color:#8a63d2}
.st-Empty{background:#f3f5f9;border-color:#ced6e2;border-left-color:#ced6e2}.st-Empty b,.st-Empty span{color:#8b97aa}
.kv{display:grid;grid-template-columns:78px 1fr;gap:7px 8px;font-size:12.5px;align-items:start}
.kv dt{color:var(--mut);font-weight:700}.kv dd{margin:0;font-weight:700}
.mat{display:flex;justify-content:space-between;gap:8px;font-weight:700;padding:3px 0;border-bottom:1px dashed #e4e9f2}
.mat:last-child{border-bottom:0}.mat span{color:#55637a;font-weight:600}
.cnt{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;gap:6px}
.cnt b{display:block;font-size:26px;line-height:1.1}.cnt small{color:var(--mut);font-weight:700;font-size:11.5px}
.list{display:grid;gap:8px;font-size:12.5px}
.rcp{display:grid;grid-template-columns:70px 56px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #eef2f8}
.rcp:last-child{border-bottom:0}
.rcp small{color:var(--mut);display:block}
.rec{padding:8px 10px;border-radius:10px;background:#f5f8fd;display:grid;gap:3px}
.rec b{font-size:12.5px}.rec .sp{display:flex;gap:5px;flex-wrap:wrap}
.sp a{background:#fff;border:1px solid #cfd9ea;border-radius:6px;padding:1px 7px;font-weight:800;font-size:11.5px;color:#1d4b92;cursor:pointer}
.sp a:hover{background:#e7f0ff}
.foot{margin-top:8px;color:#7b889c;font-size:11px;line-height:1.5}
.defs{padding:10px 16px}.defs h3{margin-bottom:4px}.defs .dgrid{column-count:4;column-gap:30px}.defs .dgrid>div{break-inside:avoid}.defs h4{margin:6px 0 3px;font-size:12.5px;color:#16336a}.defs p{margin:0 0 4px;font-size:11.5px;color:#44526a;line-height:1.45}
.logcol{position:relative;min-height:0}
.logc{position:absolute;inset:0;display:flex;flex-direction:column;padding-bottom:10px}
.logc h3{flex:none}.lsub{font-size:11px;color:var(--mut);margin:-4px 0 8px;line-height:1.4;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex:none;flex-wrap:wrap}
.tab{border:1px solid #d7e0ef;background:#fff;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:#44526a;cursor:pointer;font-family:inherit}
.tab.on{background:#16336a;color:#fff;border-color:#16336a}
.tab b{font-weight:800;opacity:.8;margin-left:3px}
.logbox{flex:1;min-height:0;overflow-y:auto;padding-right:4px}
.dh{position:sticky;top:0;background:#eef3fb;font-weight:800;font-size:11.5px;color:#31405e;padding:3px 9px;border-radius:6px;margin:8px 0 2px;z-index:1}
.li{display:grid;grid-template-columns:42px 58px 1fr auto;gap:8px;align-items:center;padding:6px 2px;border-bottom:1px solid #eef2f8}
.li .t{color:var(--mut);font-size:11px}
.li .m b{display:block;font-size:12.5px}.li small{color:var(--mut);font-size:11px;display:block}
.li .q{text-align:right}.li .q b{font-size:12.5px;display:block}
.lflt{font-size:11.5px;color:#1d4b92;font-weight:700;margin:0 0 6px;flex:none}
.c-purple{background:#7a4bc0}
.agebar{position:relative;height:12px;background:#eef2f8;border-radius:6px;overflow:visible;min-width:130px}
.agebar i{position:absolute;top:0;bottom:0;display:block}
.agebar i.a{border-radius:6px 0 0 6px}.agebar i.z{border-radius:0 6px 6px 0}
.agebar .tg{position:absolute;top:-3px;bottom:-3px;width:2px;background:#16336a;opacity:.6}
.tn td{vertical-align:middle}.tn td.do{text-align:left;font-size:12px;color:#44526a}
.tnlg{display:flex;gap:14px;font-size:11.5px;color:var(--mut);margin:0 0 8px;flex-wrap:wrap}.tnlg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tbtn{border:1px solid #cdd8ea;background:#fff;border-radius:8px;height:30px;padding:0 11px;font:inherit;font-size:12px;font-weight:700;color:#1d4b92;cursor:pointer}
.tbtn:hover{background:#eef4ff}
.hr .tbtn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
/* ---------- ① 창고 운영 현황 */
.v-ops{display:grid;grid-template-columns:1270px minmax(0,1fr);gap:12px;height:100%}
.v-ops .colL{display:flex;flex-direction:column;gap:12px;min-height:0}
.k6{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.k6>div{border-radius:12px;padding:12px 14px;background:#fff;border:1px solid #edf1f7;box-shadow:0 2px 10px rgba(22,51,106,.08)}
.k6 small{display:block;font-size:12px;font-weight:800;color:#fff;background:#2f5597;border-radius:6px;padding:4px 8px;margin-bottom:8px;text-align:center}
.k6 b{display:block;font-size:34px;text-align:center;letter-spacing:-1px;color:#16336a;line-height:1.1}
.k6 .o b{color:#c55a11}
.k6 b .ku{font-style:normal;font-size:.38em;color:#8a96a8;margin-left:3px;letter-spacing:0}
.k6 b .kc{display:block;font-style:normal;font-size:.42em;color:#c55a11;font-weight:800;letter-spacing:0;margin-top:2px}
.k6 .pk b{color:#2f5597}
.g2{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;flex:1;min-height:0}
.g2>.card{display:flex;flex-direction:column;min-height:0}
.inv{flex:1}
.inv th{font-size:13px;color:#fff;background:#2f5597;padding:9px 6px;border:0;height:54px}
.inv td{font-size:15px;padding:6px 6px;white-space:nowrap}
.inv tr.r{cursor:pointer}.inv tr.r:hover td{background:#f1f6ff}.inv tr.r.on td{background:#e7f0ff}
.chip.s-SEND-NOW{background:#e5484d}.chip.s-SEND-MORE{background:#f5a623;color:#3a2a00}.chip.s-OK{background:#3fae6a}.chip.s-FULL{background:#9dc3e6;color:#1f2a3d}.chip.s-OVER-CAPACITY{background:#7a4bc0}
.inv .chip{font-size:12px;padding:3px 10px}
.fbar{display:flex;align-items:center;gap:8px;min-width:170px}
.fbar .tr{flex:1;height:13px;border-radius:7px;background:#e3eaf6;position:relative;overflow:hidden}
.fbar .fl{position:absolute;left:0;top:0;bottom:0;border-radius:7px}
.fbar b{min-width:44px;text-align:right;font-size:14px}
.orange{color:#c55a11;font-weight:800}
.slg{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--mut);align-items:center;flex:none}
.mixbox{display:grid;gap:12px}
.mixl{display:grid;gap:9px;font-size:13px}
.mixl div{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}
.mixl .chip{min-width:96px;text-align:center}.mixl span{color:#44526a;line-height:1.4}
.trc{display:flex;flex-direction:column;min-height:0}
.trb{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 205px;gap:14px}
.trmain{display:flex;flex-direction:column;min-width:0;min-height:0}
.trmain h4{margin:0 0 6px;font-size:18px;color:#16336a;display:flex;align-items:baseline;gap:10px}
.trmain h4 small{font-size:12.5px;color:#7b889c;font-weight:600}
.trchart{flex:1;min-height:0}
.trchart{overflow:hidden}.trchart svg{display:block}

", "al_stale_n": "현장 확인", "al_change": "재고 변동 큼 ({p})", "al_mixed": "혼적 로케이션 {n}곳", "al_mixed_n": "자재 구분 확인", "act_watch_chip": "주의", "act_watch": "보유 {f}{dd} — 컨테이너 {c}대 필요", "act_dd": " · {d}일치", "act_aged": "오래된 재고 {d}일 — 입고 조절", "act_check_chip": "확인", "act_tonly_n": "T만 남은 칸", "act_tonly": "{n}칸 — T를 다 쓰거나 정리하면 비워짐", "act_stale_n": "유령잔량", "act_stale": "{c} 현장 확인", "act_mixed_n": "혼적 칸", "act_mixed": "{c} 자재 구분 확인", "d1_h": "집계 기준", "d1_p1": "재고 수량은 일반 팔레트만 셉니다. 스플릿(T코드) 팔레트와 블락 재고는 수량에서 제외합니다.", "d1_p2": "PLT = 팔레트. 케파 = 자재별로 정해 둔 최대 PLT. 받을 수 있는 양 = 케파 − 재고.", "d2_h": "로케이션 상태 (스톡리포트로 자동 판정)", "d2_p1": "사용중 — 지금 그 자재를 쓰고 있는 칸. (1) 분할 진행: 최근 T 라벨이 의미 있는 양(팔레트 절반 이상, 스플릿 단위의 10% 이상) 남은 칸. LD·RD는 반 칸, End Plate는 한 칸 단위로 스플릿하므로 T만 남은 칸도 정상입니다.{su} (2) 최근 T 라벨이 없는 자재는 입고가 가장 오래된 칸을 \"사용중 의심\"으로 표시합니다.", "d2_su": " 사용한 스플릿 단위: {s} PLT.", "d2_p2": "일부만 찬 칸(예: LD·RD 혼재 컨테이너로 26 PLT만 찬 칸)은 그것만으로 사용중이 아닙니다.", "d2_p3": "적치완료 — 일반 팔레트가 있고 사용 중이 아닌 칸.   혼적(◆) — 한 칸에 자재가 2종 이상 (일반 팔레트 또는 T 라벨 기준). 상태와 별도로 표시하므로 혼적 칸이 사용중일 수도 있습니다.", "d2_p4": "유령잔량 — T 라벨이 {days}일 넘게 남음 (잔량일 수 있어 현장 확인).   T대기 — T가 있지만 양이 적어 사용중으로 보지 않는 칸.   빈 — 아무것도 없음.", "d2_p5": "현장확인(설정 파일)에 적은 내용이 있으면 자동 판정보다 우선합니다.", "d3_h": "자리 점검", "d3_p1": "필요한 칸 = (케파 ÷ 칸당 PLT) − 이미 쓰는 칸, 자재별 합계. 칸당 PLT는 오늘 가장 꽉 찬 칸에서 추정한 값입니다.", "d3_p2": "받을 수 있는 자리 = 지금 빈 칸. T만 남은 칸은 T를 다 쓰거나 정리하면 비워집니다.", "d4_h": "기타 지표", "d4_p1": "며칠치 재고 = 재고 ÷ 하루 사용량 (자재별 일 생산량 × 배수, 설정 파일).", "d4_p2": "직전 리포트 대비는 프로그램이 저장해 둔 이력을 씁니다. 입고는 컨테이너 단위로 표시합니다.", "d6_h": "기록 (입고 · 스플릿 · 소진) 기준", "d6_p1": "입고 — 컨테이너로 들어온 원자재. 스플릿 — 일반 팔레트를 쪼개서 T 라벨이 새로 생긴 것. 소진 — 직전 리포트에 있던 T 라벨이 사라진 것 (T 라벨은 통째로 쓰이므로 사라졌다 = 사용됨).", "d6_p2": "일반 팔레트가 스플릿되어 T 라벨로 바뀌며 일반 재고에서 빠진 것은 스플릿이지 소진이 아닙니다. T 라벨이 생기지 않고 일반 팔레트만 빠진 것은 기록에 나오지 않습니다.", "d5_h": "데이터 출처", "d5_p1": "스톡리포트: {file}. 프로그램을 실행할 때 갱신됩니다. 이 파일은 실시간 계산이 아닙니다."}, "meta": {"asof": "2026-11-13", "asof_txt": "2026. 11. 13 (금) 14:27", "file": "EXPORT_20261114_043547.xlsx", "prev": "11/13 08:34", "updated": "2026- : 1, "plt": 5, "ea": 22500.0}, {"t": "in", "d": "2026-09-21", "dt": "9/21", "tm": "12:01", "mat": "MIS00302AA", "name": "Mica Sheet", "a": "TTNU8863120", "locs": ["EE-06"], "n_loc": 1, "plt": 2, "ea": 14400.0}], "log_n": {"in": 120, "split": 250, "out": 200}, "defs": [{"h": "집계 기준", "p": ["재고 수량은 일반 팔레트만 셉니다. 스플릿(T코드) 팔레트와 블락 재고는 수량에서 제외합니다.", "PLT = 팔레트. 케파 = 자재별로 정해 둔 최대 PLT. 받을 수 있는 양 = 케파 − 재고."]}, {"h": "자재 상태 (VMI)", "p": ["보유율 = 재고 ÷ 케파. 긴급 보충: 30% 미만 · 보충 필요: 70% 미만 · 정상: 70% 이상 · 가득: 90% 이상 · 초과: 100% 초과.", "며칠치 재고 = 재고 ÷ 하루 사용량. 연 회전수 = 365 ÷ 며칠치 재고. 속도: 빠름 = 재고가 15.0일 이하 · 목표 초과 = 가장 오래된 팔레트가 30일보다 오래됨 · 그 외 보통."]}, {"h": "로케이션 상태 (스톡리포트로 자동 판정)", "p": ["사용중 — 지금 그 자재를 쓰고 있는 칸. (1) 분할 진행: 최근 T 라벨이 의미 있는 양(팔레트 절반 이상, 스플릿 단위의 10% 이상) 남은 칸. LD·RD는 반 칸, End Plate는 한 칸 단위로 스플릿하므로 T만 남은 칸도 정상입니다. 사용한 스플릿 단위: Housing LD 26, Housing RD 26, Heat Sink 24, Top Plate 32, End Plate 40 PLT. (2) 최근 T 라벨이 없는 자재는 입고가 가장 오래된 칸을 \"사용중 의심\"으로 표시합니다.", "일부만 찬 칸(예: LD·RD 혼재 컨테이너로 26 PLT만 찬 칸)은 그것만으로 사용중이 아닙니다.", "적치완료 — 일반 팔레트가 있고 사용 중이 아닌 칸.   혼적(◆) — 한 칸에 자재가 2종 이상 (일반 팔레트 또는 T 라벨 기준). 상태와 별도로 표시하므로 혼적 칸이 사용중일 수도 있습니다.", "유령잔량 — T 라벨이 7일 넘게 남음 (잔량일 수 있어 현장 확인).   T대기 — T가 있지만 양이 적어 사용중으로 보지 않는 칸.   빈 — 아무것도 없음.", "현장확인(설정 파일)에 적은 내용이 있으면 자동 판정보다 우선합니다."]}, {"h": "자리 점검", "p": ["필요한 칸 = (케파 ÷ 칸당 PLT) − 이미 쓰는 칸, 자재별 합계. 칸당 PLT는 오늘 가장 꽉 찬 칸에서 추정한 값입니다.", "받을 수 있는 자리 = 지금 빈 칸. T만 남은 칸은 T를 다 쓰거나 정리하면 비워집니다."]}, {"h": "기타 지표", "p": ["며칠치 재고 = 재고 ÷ 하루 사용량 (자재별 일 생산량 × 배수, 설정 파일).", "직전 리포트 대비는 프로그램이 저장해 둔 이력을 씁니다. 입고는 컨테이너 단위로 표시합니다."]}, {"h": "기록 (입고 · 스플릿 · 소진) 기준", "p": ["입고 — 컨테이너로 들어온 원자재. 스플릿 — 일반 팔레트를 쪼개서 T 라벨이 새로 생긴 것. 소진 — 직전 리포트에 있던 T 라벨이 사라진 것 (T 라벨은 통째로 쓰이므로 사라졌다 = 사용됨).", "일반 팔레트가 스플릿되어 T 라벨로 바뀌며 일반 재고에서 빠진 것은 스플릿이지 소진이 아닙니다. T 라벨이 생기지 않고 일반 팔레트만 빠진 것은 기록에 나오지 않습니다."]}, {"h": "데이터 출처", "p": ["스톡리포트: EXPORT_20261114_043547.xlsx. 프로그램을 실행할 때 갱신됩니다. 이 파일은 실시간 계산이 아닙니다."]}], "cfg": {"packs": 480.0, "fast": 15.0, "slow": 30, "th": [0.3, 0.7, 0.9], "speed": {"win": 14, "fast const FIT = {on: store.get('vmi_fit')!=='0'};
function fit(){
  const box = $('#fit'), root = document.documentElement, tall = ST.view==='etc';
  root.classList.toggle('fit', FIT.on && !tall); root.classList.toggle('fitw', FIT.on && tall);
  document.body.style.height = '';
  if(!FIT.on){ box.style.transform=''; return; }
  const w = box.offsetWidth, h = box.offsetHeight, vv = window.visualViewport;
  const VW = Math.min(window.innerWidth, vv ? vv.width : window.innerWidth), VH = Math.min(window.innerHeight, vv ? vv.height : window.innerHeight);
  const ZM = Math.min(2, Math.max(0.3, Number(new URLSearchParams(location.search).get('zoom')) || 1));   // TV 배율 수동 조정: 주소 끝 ?zoom=0.9
  const sc = (tall ? VW / w : Math.min(VW / w, VH / h)) * ZM;
  const left = Math.max(0, (VW - w*sc) / 2), top = tall ? 0 : Math.max(0, (VH - h*sc) / 2);
  box.style.transform = `translate(${left}px,${top}px) scale(${sc})`;
  if(tall) document.body.style.height = Math.ceil(h*sc) + 'px';
}
window.addEventListener('resize', fit);

function tileText(l){

  if(l.mixed) return [l.mix_abbr.slice(0,3).join('+'), L.tile_mix + (l.t_lab?` · T ${l.t_lab}`:'')];
  if(l.mats.length===1){ const m=l.mats[0]; return [`${m.a} · ${m.plt} PLT`, l.t_lab?`T ${l.t_lab}`:'']; }

function lineName(x){ return x + L.line_sfx; }
function mapHTML(){
  /* 기존 세로 배치 그대로 (열 = 라인, 행 = 위치) — 좌우로 넓히고 칸을 얇게.
     열: 인바운드 = EE·DD | CC | BB | AA,  아웃바운드 = 좌우 + 상하 반전 (AA | BB | CC | DD·EE, 위아래 순서도 거꾸로) */
  const G = D.grid, cx = c => ST.flip ? 6 - c : c;
  const heads = [['EE · DD'+L.line_sfx,1,2],[lineName('CC'),3,1],[lineName('BB'),4,1],[lineName('AA'),5,1]];
  let h = heads.map(([t,c,sp])=>`<div class="mh" style="grid-row:1;grid-column:${sp===2?(ST.flip?4:1):cx(c)} / span ${sp}">${t}</div>`).join('');
  G.forEach((row, r)=>{
    const [e,dd,cc,bb,aa] = row, gr = ST.flip ? G.length - r + 1 : r + 2;
    const cells = (e && dd) ? [[e,cx(1),1],[dd,cx(2),1]] : [[e||dd,ST.flip?4:1,2]];
    cells.push([cc,cx(3),1],[bb,cx(4),1],[aa,cx(5),1]);
    cells.forEach(([code,col,sp])=>{
      if(!code) return;
      const pos = `grid-row:${gr};grid-column:${col} / span ${sp}`;
      const l = D.locs[code];
      if(!l){ h += `<div class="tile st-Empty" style="${pos}"><b>${code}</b><span>${L.na}</span></div>`; return; }
      const [a,b] = tileText(l), txt = [a,b].filter(Boolean).join(' · ');
      h += `<div class="tile st-${SCLS[l.status]}${l.mixed?' mx':''}" data-code="${code}" style="${pos}" title="${esc(code)} · ${stName(l.status)}${l.mixed?' · '+L.mixed:''}${txt?' · '+esc(txt):''}"><b>${code}${l.mixed?' ◆':''}${(l.status==='Stale T'||l.ghost_use)?' ⚠':''}</b><span>${esc(txt)}</span></div>`;
    });
  });
  return `<div class="map map2" id="map" style="grid-template-rows:36px repeat(${G.length},30px)">${h}</div>`;
}

function spark(vals, color, cap){

  document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{ const [y,m]=ST.calM.split('-').map(Number), d=new Date(y, m-1+Number(b.dataset.cm), 1); ST.calM=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; render(); });
  document.querySelectorAll('[data-cday]').forEach(b=>b.onclick=()=>{ const list = dayList()[b.dataset.cday]||[]; if(list.length) openDay(list[list.length-1].key, list.length>1); });
  document.querySelectorAll('[data-ckey]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); openDay(b.dataset.ckey, !!b.closest('.times')); });
  on('#printBtn','onclick',()=>window.print()); on('#csvLog','onclick',exportLog);
  document.querySelectorAll('[data-tr]').forEach(e=>e.onclick=()=>{ ST.tr = (ST.tr===e.dataset.tr && e.dataset.tr!=='all') ? 'all' : e.dataset.tr; render(); });
  /* 자재(회전표·기타 화면) 클릭 → 로케이션 화면에서 그 자재가 있는 칸 표시 */
  document.querySelectorAll('[data-mat]').forEach(e=>e.onclick=()=>{ ST.mat = ST.mat===e.dataset.mat ? null : e.dataset.mat; if(ST.mat && ST.view!=='loc'){ ST.view='loc'; store.set('vmi_view','loc'); } render(); });
  on('#pill','onclick',()=>{ST.mat=null;render();});
  document.querySelectorAll('.tile[data-code]').forEach(t=>t.onclick=()=>{ST.sel=t.dataset.code; render();});
  document.querySelectorAll('[data-pick]').forEach(a=>a.onclick=()=>{ST.sel=a.dataset.pick; toMap(); render();});
  document.querySelectorAll('.lc[data-st]').forEach(c=>c.onclick=()=>{ const s=c.dataset.st; ST.off.has(s)?ST.off.delete(s):ST.off.add(s); render(); });
  const mx = document.querySelector('.lc[data-mx]'); if(mx) mx.onclick=()=>{ST.mixed=!ST.mixed; render();};
  on('#lineSel','onchange',e=>{ST.line=e.target.value;render();});
  on('#flip','onclick',()=>{ST.flip=!ST.flip;render();});
  const q=$('#q'); if(q){ q.oninput=e=>{ST.q=e.target.value; paint();};
    q.onkeydown=e=>{ if(e.key==='Enter'){ const f=Object.values(D.locs).find(match); if(f){ST.sel=f.code; const v=ST.q; render(); const q2=$('#q'); q2.focus(); q2.setSelectionRange(v.length,v.length);} } }; }
  on('#selbox','onchange',e=>{ST.sel=e.target.value||null;render();});
  document.querySelectorAll('.tab[data-tab]').forEach(t=>t.onclick=()=>{ST.logTab=t.dataset.tab; render();});
}

/* ======================= TV 모드 ======================= */
const MODE = (ALL && ALL.mode) || 'pc';
const TVP = ['stock','trend'];   // TV: 재고 현황 · 추이/상태 두 화면만 (로케이션 · 재고 연령은 PC용에서)
const TVS = {i:0, t0:0, pin:null, sec:20, paused:false};
const tvName = k => nx('tv_'+k);
const tvChip = (txt, color, dark) => `<span class="tvchip" style="background:${color};color:${dark?'#111':'#fff'}">${esc(txt)}</span>`;
/* 언어 버튼 (마우스 클릭 · 키보드 L) — 이 TV 브라우저가 마지막 선택을 기억 */
function tvLangSeg(){
  const langs = ['ko','en'].filter(l=>BUNDLE[l]);
  if(langs.length < 2) return '';
  return `<div class="tvlang">${langs.map(l=>`<button data-tvlang="${l}" class="${l===LANG?'on':''}">${l==='ko'?'한국어':'English'}</button>`).join('')}</div>`;
}
function tvSetLang(l){ if(!BUNDLE[l] || l===LANG) return; setLang(l); store.set('vmi_tv_lang', l); tvRender(); }
function tvTop(k){
  const tabs = TVP.map(p=>`<b class="${p===k?'on':''}">${tvName(p)}</b>`).join('');
  return `<div class="tvtop"><div class="t1">VMI <span>${LANG==='ko'?'창고':'Warehouse'}</span></div><div class="tvtabs">${tabs}</div>
    <div class="dt"><small>${esc(L.as_of)}</small><b>${esc(M.asof_txt)}</b></div>${tvLangSeg()}</div><div class="tvbar"><i id="tvprog"></i></div>`;
}
function tvStock(){
  const it = items, cap = sumk(it,'cap'), on = sumk(it,'onhand'), tos = sumk(it,'tosend'), ctr = sumk(it,'ctr_sum');
  const now = it.filter(i=>i.status==='SEND NOW').length, more = it.filter(i=>i.status==='SEND MORE').length;
  const k = `<div class="tvk"><div><small>${nx('k_fill')}</small><b>${cap?pct(on/cap):'-'}</b></div><div><small>${nx('k_on')}</small><b>${fmt(on)}<em>/ ${fmt(cap)}</em></b></div>
    <div class="amb"><small>${nx('k_tos')}</small><b>${fmt(tos)}<em>${fmt(ctr)} ${nx('tv_ctr')}</em></b></div><div class="${now?'hot':'amb'}"><small>${nx('k_rep')}</small><b>${now+more}<em>${nx('tv_urg',{n:now})}</em></b></div></div>`;
  const rows = it.map(i=>{ const w=Math.min(100,(i.fill||0)*100), c=SC[i.status]||'#9aa6b8';
    return `<tr><td class="l">${esc(i.name)}</td><td>${fmt(i.onhand)} <span class="mut" style="font-size:24px">/ ${fmt(i.cap)}</span></td>
      <td><div class="tvfill"><div class="tr"><div class="fl" style="width:${w}%;background:${c}"></div></div><b>${pct(i.fill)}</b></div></td>
      <td style="color:#ffc24a">${fmt(i.tosend)}</td><td>${i.days==null?'-':f1(i.days)}</td><td>${tvChip(i.status_txt, c, i.status==='SEND MORE'||i.status==='FULL')}</td></tr>`; }).join('');
  return `${k}<div class="tvcard" style="flex:1"><table class="tvt"><tr><th class="l">${nx('h_item')}</th><th>${nx('tv_onc')}</th><th>${nx('h_fill')}</th><th>${nx('tv_tos')}</th><th>${nx('tv_days')}</th><th>${nx('h_st')}</th></tr>${rows}</table></div>`;
}
function tvTrend(){
  const it = items, R=150, Cc=2*Math.PI*R; let off=0, segs='';
  const cnt = ORD_ST.map(st=>({st, list:it.filter(i=>i.status===st)}));
  cnt.forEach(c=>{ if(!c.list.length) return; const len=Cc*c.list.length/(it.length||1); segs+=`<circle r="${R}" cx="190" cy="190" fill="none" stroke="${SC[c.st]}" stroke-width="64" stroke-dasharray="${len} ${Cc-len}" stroke-dashoffset="${-off}" transform="rotate(-90 190 190)"/>`; off+=len; });
  /* 상태 이름 대신 자재 이름을 상태 색 막대로 크게 (색은 앞 화면과 같음) */
  const mix = cnt.filter(c=>c.list.length).map(c=>c.list.map(i=>`<div class="tvpill" style="background:${SC[c.st]};color:${c.st==='SEND MORE'||c.st==='FULL'?'#1a1200':'#fff'}">${esc(i.name)}</div>`).join('')).join('');
  const tl = trLabels(), S = trSeries('all');
  return `<div class="tvrow" style="grid-template-columns:720px minmax(0,1fr)">
    <div class="tvcard"><h3>${nx('mix_title')}</h3><svg width="300" height="300" viewBox="0 0 380 380" style="margin:0 auto 14px;display:block;flex:none">${segs}<text x="190" y="205" text-anchor="middle" font-size="96" font-weight="900" fill="#fff">${it.length}</text></svg><div class="tvpills">${mix}</div></div>
    <div class="tvcard"><h3>${nx('tr_title')} <small>${nx('tv_trsub')}</small></h3><div id="tvchart" style="flex:1;min-height:0"></div>
      <div class="tvlg" style="margin-top:10px"><b><i style="background:#5aa9ff"></i>${nx('tr_on')}</b><b><i style="background:#8ea6d0"></i>${nx('tr_cap')}</b>${tl.length>=2?`<b>${tl[0]} → ${tl[tl.length-1]}</b>`:''}</div></div></div>`;
}
function tvChartDraw(){
  const c = $('#tvchart'); if(!c) return;
  const tl = trLabels(), S = trSeries('all'); if(tl.length<2){ c.innerHTML = `<div class="tvnote">${nx('tr_none')}</div>`; return; }
  const W=c.clientWidth, H=c.clientHeight, pl=150, pr=30, pt=24, pb=64, n=tl.length;
  const vals=[...S.on,...S.cap].filter(v=>v!=null), mx=Math.max(1,Math.ceil(Math.max(...vals)*1.1));
  const X=i=>pl+i*(W-pl-pr)/(n-1), Y=v=>pt+(H-pt-pb)*(1-v/mx); let g='';
  for(let k=0;k<=4;k++){ const v=mx*k/4, y=Y(v); g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#24447d" stroke-width="2"/><text x="${pl-16}" y="${y+11}" text-anchor="end" font-size="32" font-weight="700" fill="#8ea6d0">${fmt(v)}</text>`; }
  const step=Math.max(1,Math.ceil(n/Math.max(2,Math.floor((W-pl-pr)/170))));
  tl.forEach((t,i)=>{ if(i===n-1||(i%step===0&&(n-1-i)>=step)) g+=`<text x="${X(i)}" y="${H-14}" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" font-size="32" font-weight="700" fill="#8ea6d0">${esc(t)}</text>`; });
  g+=`<polyline fill="none" stroke="#8ea6d0" stroke-width="5" stroke-dasharray="16 12" points="${S.cap.map((v,i)=>v==null?'':X(i)+','+Y(v)).join(' ')}"/>`;
  const pts=S.on.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
  g+=`<polyline fill="none" stroke="#5aa9ff" stroke-width="8" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  pts.forEach(p=>{ g+=`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="#081227" stroke="#5aa9ff" stroke-width="5"/>`; });
  c.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function tvLoc(){
  const G = D.grid, cx = c => ST.flip ? 6 - c : c;
  let h = [['EE · DD'+L.line_sfx,1,2],[lineName('CC'),3,1],[lineName('BB'),4,1],[lineName('AA'),5,1]]
    .map(([t,c,sp])=>`<div class="mh" style="grid-row:1;grid-column:${sp===2?(ST.flip?4:1):cx(c)} / span ${sp}">${t}</div>`).join('');
  G.forEach((row, r)=>{
    const [e,dd,cc,bb,aa] = row, gr = ST.flip ? G.length - r + 1 : r + 2;
    const cells = (e && dd) ? [[e,cx(1),1],[dd,cx(2),1]] : [[e||dd,ST.flip?4:1,2]];
    cells.push([cc,cx(3),1],[bb,cx(4),1],[aa,cx(5),1]);
    cells.forEach(([code,col,sp])=>{ if(!code) return; const l = D.locs[code], pos=`grid-row:${gr};grid-column:${col} / span ${sp}`;
      if(!l){ h += `<div class="tile st-Empty" style="${pos}"><b>${code}</b></div>`; return; }
      const [a,b] = tileText(l), txt=[a,b].filter(Boolean).join(' · ');
      h += `<div class="tile st-${SCLS[l.status]}${l.mixed?' mx':''}" style="${pos}"><b>${code}${(l.status==='Stale T'||l.ghost_use)?' ⚠':''}</b><span>${esc(txt)}</span></div>`; });
  });
  const cnt = s => Object.values(D.locs).filter(l=>l.status===s).length;
  const lg = STATUS_ORDER.map(s=>`<b><i style="background:${STATUS_COLOR[s]}"></i>${stName(s)} ${cnt(s)}</b>`).join('');
  const stale = Object.values(D.locs).filter(l=>l.status==='Stale T').map(l=>l.code).sort();
  return `<div class="tvlg">${lg}<b style="background:transparent;color:#8ea6d0">${ST.flip?L.view_out:L.view_in}</b>${stale.length?`<span class="tvwarn" style="margin-left:auto">⚠ ${nx('tv_stale',{n:stale.length})}: ${stale.slice(0,8).join(', ')}${stale.length>8?' …':''}</span>`:''}</div>
    <div class="tvmap" style="grid-template-rows:46px repeat(${G.length},minmax(0,1fr))">${h}</div>`;
}
function tvTurn(){
  const rows = D.items.filter(i=>i.speed && i.speed!=='-').sort((a,b)=>((b.over||0)-(a.over||0)) || (a.days-b.days));
  const slow = D.cfg.slow, mx = Math.max(slow*1.15, ...rows.map(i=>i.oldest||0))*1.05;
  const spc = {Fast:'#ffc24a',Normal:'#34c77b',Slow:'#5aa9ff',None:'#6b7f9f'};
  const body = rows.map(i=>{ const o=i.oldest||0, w=v=>(v/mx*100).toFixed(1)+'%';
    const bar = o>slow ? `<i style="left:0;width:${w(slow)};background:#34c77b"></i><i style="left:${w(slow)};width:${w(o-slow)};background:#a07cff"></i>` : `<i style="left:0;width:${w(o)};background:#34c77b"></i>`;
    return `<tr><td class="l">${esc(i.name)}</td><td>${f1(i.days)}</td><td class="mut">${f1(i.turns)}</td>
      <td><div class="tvfill"><b style="min-width:60px">${i.oldest==null?'-':i.oldest}</b><div class="tvage">${bar}<div class="tg" style="left:${w(slow)}"></div></div></div></td>
      <td>${tvChip(i.speed_txt, spc[i.speed]||'#6b7f9f', i.speed==='Fast')}${i.use_ratio!=null?` <span class="mut" style="font-size:26px">${Math.round(i.use_ratio*100)}%</span>`:''}</td>
      <td class="l" style="font-size:28px;font-weight:700;color:${(i.over||0)>0?'#d6c6ff':'#dbe6fa'}">${esc(i.do)}</td></tr>`; }).join('');
  return `<div class="tvcard" style="flex:1"><h3>${L.tn_title} <small>${nx('tv_turnsub',{slow, w:(D.cfg.speed||{}).win||14})}</small></h3>
    <table class="tvt"><tr><th class="l">${L.tn_h_mat}</th><th>${L.tn_h_days}</th><th>${L.tn_h_turns}</th><th>${L.tn_h_old}</th><th>${L.tn_h_speed}</th><th class="l">${L.tn_h_do}</th></tr>${body}</table></div>`;
}
function tvRender(){
  const k = TVS.pin || TVP[TVS.i % TVP.length];
  const body = k==='trend' ? tvTrend() : k==='loc' ? tvLoc() : k==='turn' ? tvTurn() : tvStock();
  $('#app').className = 'tvpage';
  $('#app').innerHTML = tvTop(k) + `<div class="tvbody">${body}</div>`;
  if(k==='trend') tvChartDraw();
  document.querySelectorAll('[data-tvlang]').forEach(b=>b.onclick=()=>tvSetLang(b.dataset.tvlang));
  fit();
}
function tvInit(){
  document.documentElement.classList.add('tv');
  const q = new URLSearchParams(location.search);
  if(TVP.includes(q.get('view'))) TVS.pin = q.get('view');
  const sec = Number(q.get('sec')); if(sec >= 5) TVS.sec = sec;
  ST.flip = q.get('dir') !== 'in';
  tvRender();
  TVS.t0 = Date.now();
  setInterval(()=>{                                   // 자동 넘김 + 진행 막대
    if(TVS.pin || TVS.paused){ const b=$('#tvprog'); if(b) b.style.width = TVS.pin ? '100%' : b.style.width; return; }
    const r = (Date.now()-TVS.t0)/(TVS.sec*1000);
    if(r >= 1){ TVS.i++; TVS.t0 = Date.now(); tvRender(); return; }
    const b = $('#tvprog'); if(b) b.style.width = (r*100).toFixed(1)+'%';
  }, 200);
  document.addEventListener('keydown', e=>{               // 리모컨 · 키보드: ← → 넘기기, 스페이스 멈춤
    if(e.key==='ArrowRight'){ TVS.pin=null; TVS.i++; TVS.t0=Date.now(); tvRender(); }
    else if(e.key==='ArrowLeft'){ TVS.pin=null; TVS.i=(TVS.i+TVP.length-1); TVS.t0=Date.now(); tvRender(); }
    else if(e.key===' '){ TVS.paused=!TVS.paused; TVS.t0=Date.now(); }
    else if(e.key==='l' || e.key==='L'){ tvSetLang(LANG==='ko'?'en':'ko'); }
  });
  const rl = q.get('reload') === '0' ? 0 : (Number(q.get('reload')) || 10);   // 몇 분마다 새로고침 (갱신된 파일을 자동으로 다시 읽음)
  if(rl > 0) setTimeout(()=>{ try{ const u=new URL(location.href); u.searchParams.set('_t', Date.now()); location.replace(u.toString()); }catch(e){ location.reload(); } }, rl*60*1000);   // 매번 새 파일을 받도록 (웹 캐시 우회)
}

(function(){
  let lg = null;
  try{ lg = new URLSearchParams(location.search).get('lang'); }catch(e){}
  setLang(lg || (MODE==='tv' ? store.get('vmi_tv_lang') : store.get('vmi_lang')) || BUNDLE.def);
  if(MODE === 'tv'){ FIT.on = true; window.addEventListener('resize', fit); tvInit(); return; }
  document.addEventListener('click', ()=>{ if(ST.cal){ ST.cal=false; render(); } });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && ST.cal){ ST.cal=false; render(); } });
  let vw = null; try{ vw = new URLSearchParams(location.search).get('view'); }catch(e){}
  ST.view = VIEWS.includes(vw) ? vw : (VIEWS.includes(store.get('vmi_view')) ? store.get('vmi_view') : 'ops');
  render();
  window.addEventListener('beforeprint', ()=>{ document.documentElement.classList.remove('fit'); $('#fit').style.transform=''; });
  window.addEventListener('afterprint', fit);
})();
</script>
